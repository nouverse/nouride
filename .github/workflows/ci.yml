# A push's checks, and the whole suite when it is asked for.
#
# A push runs `checks`: the lint, the site's pages and the contract tests, which read what a release is made of (the
# workflows, the notes, the docs, every published file). A few minutes. The whole suite ran here on every push once: a
# quarter of an hour each, and one more chance of a red while a release waited on it. It runs on the machine a change
# is made on before the push (`bun run verify`), and here once a release, when asked:
#
#   gh workflow run ci.yml --repo nouverse/nouride --ref releases/v<X.Y.Z>
#
# That runs `verify`, the lint and the whole suite on Linux (its Linux-only half, process groups, prlimit, /proc, the
# pty, never runs on a Mac), and `verify-private`, the same over the private submodules, on that branch's commit. A
# tag on a commit where they passed does not run them again; on any other commit release.yml runs the suite itself
# before it publishes anything, so no release is built from a commit the suite never passed on.
#
# Deliberately one Bun version, not a matrix: the daemon targets a single one — `.bun-version`, which every
# workflow, the image and the types read — and a matrix here would test combinations nothing ships on.
#
# Whether the image still builds is `ci-image.yml`'s, which runs when something the Dockerfile copies changes.
#
# Every push runs `checks`, documentation and the site included: `lint:check` and the contract tests read more than
# code (the release notes, the site's pages, every published file for `check-public`), and ignoring `docs/**` once let
# such a commit land unchecked. So no path filter on the trigger either. A push that changed the root helper's files
# also runs `helper` (`changes`, scripts/ci-changes.ts).

name: ci

on:
  push:
    # A release branch too: its commits are checked before the branch reaches `main`.
    # `lts/**`: a long-term line's maintenance branch (0.8.18, PLAN §3.3), whose fixes are tested as a release's are.
    branches: ["main", "releases/**", "lts/**"]
  # The whole suite on a branch's commit, asked for by hand: see the header.
  workflow_dispatch:
  # No pull request here: Nouride's own work is pushed to a release branch, and `main` is fast-forwarded at the
  # release. Somebody else's pull request has a workflow of its own, pr.yml, which is given nothing: every job here can
  # run on the machine that builds releases (`CI_RUNNER`), and a fork's code must not. `workflow-pins.test.ts` keeps
  # this workflow, and every other but the two a pull request starts, without the trigger.

# A new push makes the previous run's answer irrelevant, so it is cancelled rather than left to finish and report on a
# commit nobody is looking at any more. By the event too: a push's checks and an asked-for suite on one branch are two
# answers, and neither cancels the other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # No `packages:` — nothing here pushes. The point is that the image BUILDS, and a
  # registry credential would only widen what a run can reach.


# ── Runner ────────────────────────────────────────────────────────────────────
# GitHub-hosted (`ubuntu-24.04`, not `ubuntu-latest`, which GitHub moves to Ubuntu 26 from 2026-10-19 —
# a new image is a change to make on purpose, through a CI run first) unless the repository variable
# `CI_RUNNER` says otherwise. To go
# back to the self-hosted build runner without editing this file, set it (Settings → Secrets and
# variables → Actions → Variables) to the JSON of the labels:
#
#   CI_RUNNER = ["self-hosted", "build-runner"]
#
# The self-hosted line each job used is kept, commented, beside its `runs-on`.
jobs:
  # `main` is fast-forwarded to a release branch's commit when the release is tagged, and that commit's run on the
  # branch already proved it: running every job again on `main` was four runs of the same checks a release, and each
  # one another chance of a red on a commit already green (two went red there; REVIEW B4). So on `main` each of a
  # push's jobs asks first whether it passed on this commit, in a successful run of this workflow, and is skipped if it
  # did, as release.yml's verify jobs are on a tag. Its own conclusion, not the run's: a run on `main` that skipped its
  # jobs is a successful run too. Not asked anywhere else, and an answer that cannot be had runs the jobs.
  passed:
    if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'nouverse' }}
    # runs-on: [self-hosted, build-runner]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    permissions:
      contents: read
      actions: read # this workflow's runs on this commit, and their jobs
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.passed.outputs.checks }}
      helper: ${{ steps.passed.outputs.helper }}
    steps:
      # GitHub-hosted images ship `gh`; the self-hosted build runner does not. Fetched into this job's temp directory
      # when missing, at the version release.yml pins and checks.
      - name: GitHub CLI
        run: |
          command -v gh >/dev/null && exit 0
          v=2.102.0
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_amd64.tar.gz"
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Which jobs already passed on this commit
        id: passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          passed=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${GITHUB_SHA}" --status success --json databaseId --jq '.[].databaseId' 2>/dev/null \
            | while read -r run; do gh run view "${run}" --repo "${GITHUB_REPOSITORY}" --json jobs --jq '.jobs[] | select(.conclusion == "success") | .name' 2>/dev/null; done || true)
          for job in checks helper; do
            if printf '%s\n' "${passed}" | grep -qx "${job}"; then
              echo "${job//-/_}=yes" >> "$GITHUB_OUTPUT"
              echo "::notice::${job} already passed on ${GITHUB_SHA}; it is skipped here."
            fi
          done

  # Whether the push changed the root helper, and so needs its job. A suite that was asked for has no push to read.
  changes:
    if: ${{ github.event_name == 'push' && github.repository_owner == 'nouverse' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      helper: ${{ steps.needs.outputs.helper }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: needs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: bun run scripts/ci-changes.ts "${BEFORE}" "${GITHUB_SHA}"

  # What every push is held to, whatever it changed: the lint, the site's pages and the contract tests.
  checks:
    needs: [passed]
    # Whatever `passed` did, skipped off `main` included: without a status function GitHub skips a job whose need was.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.passed.outputs.checks != 'yes' && github.repository_owner == 'nouverse' }}
    # runs-on: [self-hosted, build-runner]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      # No submodules: everything this job checks is in this repository. The ones under
      # `internals/` are private and are not needed to verify.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The self-hosted runner keeps its working copy between jobs, submodules and all: the last job's private checkout
      # would be read as this commit's, built into a public image, or stop the next checkout over what its install changed.
      - name: Start without the last job's submodules
        run: if git config --get-regexp '^submodule\.' >/dev/null; then git submodule deinit --force --all; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Packages from the last run, keyed on the lockfiles: an install is then a link step, not a
      # download of every dependency on every push.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # One install for everything, the WhatsApp bridge included: it is a workspace member.
      - run: bun install --frozen-lockfile
      # `routeTree.gen.ts` is written by the TanStack Router Vite plugin and is gitignored, so a
      # fresh checkout does not have it and twenty-seven route files fail to typecheck. Building the
      # dashboard produces it — and proves the dashboard builds, which nothing else here did.
      - run: bun run build:dashboard
      - run: bun run lint:check
      # The site's pages: `astro check`, kept out of the commit hook for its cost (scripts/lint-sources.ts).
      - run: bun run lint:site
      # Its temporary files in the job's own folder, which the runner empties at each job's start and end: what a test
      # leaves behind cannot pile up on the self-hosted runner's disk (13 GB in `/tmp` filled it on 2026-10-29).
      - run: bun run test:contracts
        env:
          TMPDIR: ${{ runner.temp }}

  # The whole suite with the lint, on Linux: once a release, when asked (the header has the command). release.yml's
  # `verify` is this job at a tag, and is skipped there where this one passed on the tagged commit.
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository_owner == 'nouverse' }}
    # runs-on: [self-hosted, build-runner]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    # A hung test must not spend six hours of runner time, the default.
    timeout-minutes: 25
    steps:
      # No submodules: everything this job checks is in this repository. The ones under
      # `internals/` are private and are not needed to verify.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The self-hosted runner keeps its working copy between jobs, submodules and all: the last job's private checkout
      # would be read as this commit's, built into a public image, or stop the next checkout over what its install changed.
      - name: Start without the last job's submodules
        run: if git config --get-regexp '^submodule\.' >/dev/null; then git submodule deinit --force --all; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Packages from the last run, keyed on the lockfiles: an install is then a link step, not a
      # download of every dependency on every push.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # One install for everything, the WhatsApp bridge included: it is a workspace member.
      - run: bun install --frozen-lockfile
      # `routeTree.gen.ts` is written by the TanStack Router Vite plugin and is gitignored, so a
      # fresh checkout does not have it and twenty-seven route files fail to typecheck. Building the
      # dashboard produces it — and proves the dashboard builds, which nothing else here did.
      - run: bun run build:dashboard
      - run: bun run lint:check
      # The site's pages: `astro check`, kept out of the commit hook for its cost (scripts/lint-sources.ts).
      - run: bun run lint:site
      # Its temporary files in the job's own folder, which the runner empties at each job's start and end: what a test
      # leaves behind cannot pile up on the self-hosted runner's disk (13 GB in `/tmp` filled it on 2026-10-29).
      - run: bun run test
        env:
          TMPDIR: ${{ runner.temp }}

  # The root helper, `nouride-run` (packages/isolation/root): its unit tests and the escape tests, as root, with real
  # users, in a throwaway container — the one place they can run. Run on a Mac they say so and pass nothing, so this is
  # where they are proved. Also `fmt` and `clippy`: the one program that runs as root is held to its own lint.
  helper:
    needs: [passed, changes]
    if: ${{ !cancelled() && needs.changes.outputs.helper == 'true' && needs.passed.outputs.helper != 'yes' && github.repository_owner == 'nouverse' }}
    # runs-on: [self-hosted, build-runner]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh packages/isolation/scripts/test-root.sh

  # The Pro code, verified in nouverse/nouride-pro: its verify.yml checks this commit with the private submodules at
  # their pins (lint, the whole suite, the Pro edition assembled). Not here since 2026-11-06: this repository is public,
  # and so are its logs, which would say what Pro does. This job starts that run, waits for it, and reports its
  # conclusion and nothing else; a run that cannot be started or found fails here, never passes. With `verify`, when
  # the suite is asked for, and only under nouverse: a fork holds no token for it. The Pro half of a release asks the
  # same of a tag unless this passed on its commit.
  verify-private:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository_owner == 'nouverse' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: The Pro checks in nouverse/nouride-pro, for this commit
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          error() { printf '::%s::%s\n' error "$*"; }
          [ -n "${GH_TOKEN}" ] || { error "RELEASES_REPO_TOKEN is not set, so the Pro code is not verified."; exit 1; }
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run verify.yml --repo nouverse/nouride-pro -f ref="${GITHUB_SHA}"
          run=""
          for _ in $(seq 1 30); do
            sleep 5
            run=$(gh run list --repo nouverse/nouride-pro --workflow verify.yml --event workflow_dispatch --limit 20 \
              --json databaseId,displayTitle,createdAt --jq ".[] | select(.displayTitle == \"verify ${GITHUB_SHA}\" and .createdAt >= \"${since}\") | .databaseId" | head -n1)
            [ -n "${run}" ] && break
          done
          [ -n "${run}" ] || { error "the Pro checks were started but their run was not found."; exit 1; }
          # Asked until it has ended, a request that fails among them. `gh run watch` gives up on one failed request,
          # and the run it left was then read once: still at work, it has no conclusion, and this job said the Pro
          # checks had ended '' over a run that went on and passed.
          conclusion=""
          for _ in $(seq 1 110); do
            state=$(gh run view "${run}" --repo nouverse/nouride-pro --json status,conclusion --jq '.status + " " + .conclusion' 2>/dev/null || true)
            case "${state}" in "completed "*) conclusion="${state#completed }"; break ;; esac
            sleep 30
          done
          [ -n "${conclusion}" ] || { error "the Pro checks had not ended after 55 minutes (their run is ${run} in nouverse/nouride-pro)."; exit 1; }
          echo "the Pro checks: ${conclusion}"
          [ "${conclusion}" = "success" ] || { error "the Pro checks ended '${conclusion}' (their log is in nouverse/nouride-pro)."; exit 1; }
