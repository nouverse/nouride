# The same checks a release runs, on every push and pull request.
#
# `release.yml` gates publishing on `bun run lint:check` + the full suite, which meant the checks
# existed but only ever ran on a `v*` tag — the one moment where finding a regression is most
# expensive and least expected. This runs them where they are cheap to fix instead.
#
# Deliberately one Bun version, not a matrix: the daemon targets a single one — `.bun-version`, which every
# workflow, the image and the types read — and a matrix here would test combinations nothing ships on.
#
# Two jobs: `verify`, the public tree's checks, and `verify-private`, the same over the private
# submodules. Whether the image still builds is `ci-image.yml`'s, which runs when something the
# Dockerfile copies changes.
#
# What runs depends on what the push changed (`changes`, scripts/ci-changes.ts; the owner, 2026-11-06): code runs
# everything; documentation and the site alone run `docs`, the light job. Not a path filter on the trigger: the suite
# and `lint:check` read more than code (the release notes, the site's pages, every published file for `check-public`),
# and ignoring `docs/**` once let such a commit land unchecked. `docs` runs exactly the checks that read them.

name: ci

on:
  push:
    # A release branch too: the suite's Linux-only half (process groups, prlimit, /proc, the pty) never runs on a
    # Mac, and this is where it runs before the branch reaches `main`.
    # `lts/**`: a long-term line's maintenance branch (0.8.18, PLAN §3.3), whose fixes are tested as a release's are.
    branches: ["main", "releases/**", "lts/**"]
  # No pull requests (2026-10-29, the owner): work is pushed to a release branch, and `main` is fast-forwarded at the
  # release. A pull request's run went to GitHub's runners, which billing refused — and a fork's, on the runner, would
  # run its code on the machine that builds releases. `workflow-pins.test.ts` keeps every workflow without one.

# A new push makes the previous run's answer irrelevant, so it is cancelled rather than left to finish and report on a
# commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # No `packages:` — nothing here pushes. The point is that the image BUILDS, and a
  # registry credential would only widen what a run can reach.


# ── Runner ────────────────────────────────────────────────────────────────────
# GitHub-hosted (`ubuntu-24.04`, not `ubuntu-latest`, which GitHub moves to Ubuntu 26 from 2026-10-19 —
# a new image is a change to make on purpose, through a CI run first) unless the repository variable
# `CI_RUNNER` says otherwise. To go
# back to the self-hosted build runner without editing this file, set it (Settings → Secrets and
# variables → Actions → Variables) to the JSON of the labels:
#
#   CI_RUNNER = ["self-hosted", "build-runner"]
#
# The self-hosted line each job used is kept, commented, beside its `runs-on`.
jobs:
  # `main` is fast-forwarded to a release branch's commit when the release is tagged, and that commit's run on the
  # branch already proved it: running every job again on `main` was four runs of the same tests a release, and each one
  # another chance of a red on a commit already green (two went red there; REVIEW B4). So on `main` each job asks
  # first whether it passed on this commit, in a successful run of this workflow, and is skipped if it did, as
  # release.yml's verify jobs are on a tag. Its own conclusion, not the run's: a run on `main` that skipped its jobs is
  # a successful run too. Not asked anywhere else, and an answer that cannot be had runs the jobs.
  passed:
    if: ${{ github.ref == 'refs/heads/main' && github.repository_owner == 'nouverse' }}
    # runs-on: [self-hosted, build-runner]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    permissions:
      contents: read
      actions: read # this workflow's runs on this commit, and their jobs
    timeout-minutes: 5
    outputs:
      verify: ${{ steps.passed.outputs.verify }}
      verify_private: ${{ steps.passed.outputs.verify_private }}
      helper: ${{ steps.passed.outputs.helper }}
    steps:
      # GitHub-hosted images ship `gh`; the self-hosted build runner does not. Fetched into this job's temp directory
      # when missing, at the version release.yml pins and checks.
      - name: GitHub CLI
        run: |
          command -v gh >/dev/null && exit 0
          v=2.102.0
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/gh.tar.gz" "https://github.com/cli/cli/releases/download/v${v}/gh_${v}_linux_amd64.tar.gz"
          echo "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${v}_linux_amd64/bin" >> "$GITHUB_PATH"
      - name: Which jobs already passed on this commit
        id: passed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          passed=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${GITHUB_SHA}" --status success --json databaseId --jq '.[].databaseId' 2>/dev/null \
            | while read -r run; do gh run view "${run}" --repo "${GITHUB_REPOSITORY}" --json jobs --jq '.jobs[] | select(.conclusion == "success") | .name' 2>/dev/null; done || true)
          for job in verify verify-private helper; do
            if printf '%s\n' "${passed}" | grep -qx "${job}"; then
              echo "${job//-/_}=yes" >> "$GITHUB_OUTPUT"
              echo "::notice::${job} already passed on ${GITHUB_SHA}; it is skipped here."
            fi
          done

  # What the push changed, and so which of the jobs below it needs.
  changes:
    if: github.repository_owner == 'nouverse'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.needs.outputs.code }}
      helper: ${{ steps.needs.outputs.helper }}
      docs: ${{ steps.needs.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: needs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: bun run scripts/ci-changes.ts "${BEFORE}" "${GITHUB_SHA}"

  # Documentation and the site alone: the checks that read them, a few minutes instead of the suite's half hour.
  docs:
    needs: [changes]
    if: ${{ needs.changes.outputs.code != 'true' && needs.changes.outputs.docs == 'true' && github.repository_owner == 'nouverse' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build:dashboard
      - run: bun run lint:check
      - run: bun run lint:site
      - run: bun run test:contracts
        env:
          TMPDIR: ${{ runner.temp }}

  verify:
    needs: [passed, changes]
    # Whatever `passed` did, skipped off `main` included: without a status function GitHub skips a job whose need was.
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.passed.outputs.verify != 'yes' && github.repository_owner == 'nouverse' }}
    # runs-on: [self-hosted, build-runner]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    # A hung test must not spend six hours of runner time, the default.
    timeout-minutes: 25
    steps:
      # No submodules: everything this job checks is in this repository. The ones under
      # `internals/` are private and are not needed to verify.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The self-hosted runner keeps its working copy between jobs, submodules and all: the last job's private checkout
      # would be read as this commit's, built into a public image, or stop the next checkout over what its install changed.
      - name: Start without the last job's submodules
        run: if git config --get-regexp '^submodule\.' >/dev/null; then git submodule deinit --force --all; fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Packages from the last run, keyed on the lockfiles: an install is then a link step, not a
      # download of every dependency on every push.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # One install for everything, the WhatsApp bridge included: it is a workspace member.
      - run: bun install --frozen-lockfile
      # `routeTree.gen.ts` is written by the TanStack Router Vite plugin and is gitignored, so a
      # fresh checkout does not have it and twenty-seven route files fail to typecheck. Building the
      # dashboard produces it — and proves the dashboard builds, which nothing else here did.
      - run: bun run build:dashboard
      - run: bun run lint:check
      # The site's pages: `astro check`, kept out of the commit hook for its cost (scripts/lint-sources.ts).
      - run: bun run lint:site
      # Its temporary files in the job's own folder, which the runner empties at each job's start and end: what a test
      # leaves behind cannot pile up on the self-hosted runner's disk (13 GB in `/tmp` filled it on 2026-10-29).
      - run: bun run test
        env:
          TMPDIR: ${{ runner.temp }}

  # The root helper, `nouride-run` (packages/isolation/root): its unit tests and the escape tests, as root, with real
  # users, in a throwaway container — the one place they can run. Run on a Mac they say so and pass nothing, so this is
  # where they are proved. Also `fmt` and `clippy`: the one program that runs as root is held to its own lint.
  helper:
    needs: [passed, changes]
    if: ${{ !cancelled() && needs.changes.outputs.helper == 'true' && needs.passed.outputs.helper != 'yes' && github.repository_owner == 'nouverse' }}
    # runs-on: [self-hosted, build-runner]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh packages/isolation/scripts/test-root.sh

  # The Pro code: the private submodules, checked out, and the same checks over them.
  #
  # `verify` checks out no submodule, so the code the Box editions are built from — pairing, licensing, onboarding,
  # the update source, multi-user, sign-in, flash — was tested, typechecked and linted only when one laptop ran
  # `bun run verify`: about 215 Pro tests and the engine's drift tests against the plugins' declarations skipped
  # here, and every Box binary was built from it with every gate green.
  #
  # Pushes only, and only in this repository: a pull request — a fork's above all — never holds the token, and the
  # public tree this repository exports has no private submodules to check. Without the secret it fails rather than
  # skips: a gate that quietly stops running is how the editions it guards stopped being built (RELEASE_VARIANTS).
  # release.yml runs the same job on a tag unless this one already passed on that commit.
  verify-private:
    needs: [passed, changes]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.changes.outputs.code == 'true' && needs.passed.outputs.verify_private != 'yes' && github.repository_owner == 'nouverse' }}
    # runs-on: [self-hosted, build-runner]
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The self-hosted runner keeps its working copy between jobs, submodules and all: the last job's private checkout
      # would be read as this commit's, built into a public image, or stop the next checkout over what its install changed.
      - name: Start without the last job's submodules
        run: if git config --get-regexp '^submodule\.' >/dev/null; then git submodule deinit --force --all; fi
      # Both: the hosted gateway's drift tests read `internals/nougate` as the Pro ones read `internals/pro`, and
      # one token reads both. Through `-c`, not `git config --global`: no later step holds it, and on the
      # self-hosted runner a global config would outlive the job.
      - name: Check out the private submodules
        env:
          TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          error() { printf '::%s::%s\n' error "$*"; }
          if [ -z "${TOKEN}" ]; then
            error "SUBMODULE_TOKEN is not set, so the Pro code is not verified. It needs read access to nouverse/nouride-pro and nouverse/nougate."
            exit 1
          fi
          git -c "url.https://x-access-token:${TOKEN}@github.com/.insteadOf=https://github.com/" submodule update --init --depth 1 internals/pro internals/nougate
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-private-${{ runner.os }}-${{ hashFiles('bun.lock', 'internals/pro/bun.lock') }}
          restore-keys: bun-private-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # `internals/pro` is a workspace of its own, with its own lockfile: the setup console's build tools.
      - run: bun install --frozen-lockfile
        working-directory: internals/pro
      # What the hosted-gateway drift tests import (`drizzle-orm`).
      - run: bun install --production --frozen-lockfile
        working-directory: internals/nougate/apps/backend
      # The voice and video tests run ffmpeg, and skip without it.
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
      - run: bun run build:dashboard
      # With the submodule present `lint:check` covers it too: the Pro tsconfigs in `check-types.ts`, and the size
      # and dead-code rules over `internals/pro`.
      - run: bun run lint:check
      # Its temporary files in the job's own folder, which the runner empties at each job's start and end: what a test
      # leaves behind cannot pile up on the self-hosted runner's disk (13 GB in `/tmp` filled it on 2026-10-29).
      - run: bun run test
        env:
          TMPDIR: ${{ runner.temp }}
      # The Pro edition assembles, and carries what it says: `build:pro` asserts its plugins are in the bundle.
      - run: bun run build:pro --pro --bundle-only
