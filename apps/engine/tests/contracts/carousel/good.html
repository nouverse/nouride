<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Tiga langkah menyeduh kopi</title>
<style>
  body { margin: 0; background: #555; }
  .slide { width: 1080px; height: 1350px; overflow: hidden; position: relative; box-sizing: border-box; padding: 96px; background: #ffffff; color: #111111; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; }
  .slide.dark { background: #111111; color: #ffffff; }
  h1 { font-size: 112px; line-height: 1.05; margin: 0 0 40px; }
  h2 { font-size: 84px; line-height: 1.1; margin: 0 0 32px; }
  p { font-size: 44px; line-height: 1.35; margin: 0; }
  .n { position: absolute; left: 96px; bottom: 96px; font-size: 36px; }
</style>
</head>
<body>
<section class="slide dark">
  <h1>Tiga langkah menyeduh kopi di rumah</h1>
  <p>Tanpa alat mahal. Geser.</p>
  <span class="n">1 / 3</span>
</section>
<section class="slide">
  <h2>Giling sebelum seduh</h2>
  <p>Kopi yang digiling tepat sebelum diseduh wanginya lebih kuat.</p>
  <span class="n">2 / 3</span>
</section>
<section class="slide dark">
  <h2>Simpan resepnya</h2>
  <p>Ikuti @kopisenja untuk resep berikutnya.</p>
  <span class="n">3 / 3</span>
</section>
</body>
</html>
